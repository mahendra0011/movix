<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — movix</title>
    <meta name="color-scheme" content="dark light" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font:
          15px/1.5 system-ui,
          -apple-system,
          sans-serif;
        background: #030711;
        color: #fafafa;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.5rem;
        background: #1e293b;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .icon svg {
        width: 2.5rem;
        height: 2.5rem;
        stroke: #6366f1;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
        margin-bottom: 1.5rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      a,
      button {
        padding: 0.6rem 1.25rem;
        border-radius: 0.5rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: none;
      }
      .primary {
        background: #fafafa;
        color: #030711;
      }
      .secondary {
        background: #1e293b;
        color: #fafafa;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M18.364 5.636a9 9 0 0 1 0 12.728m0 0-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 0 1 0 7.072m0 0-2.829-2.829m-4.243 2.829a4.978 4.978 0 0 1-1.414-2.83m-1.414 5.658a9 9 0 0 1-2.167-9.238m7.824 2.167a1 1 0 1 1 1.414 1.414m-1.414-1.414L3 3m8.293 8.293 1.414 1.414"
          />
        </svg>
      </div>
      <h1>No internet connection</h1>
      <p>It looks like you're offline. Check your connection and try again.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Go home</a>
      </div>
    </div>
  </body>
</html>
